<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urna do Capitão</title>
<style>
:root{--bg:#e9ece6;--card:#fbfcfa;--ink:#1c2420;--mut:#5d6b63;--line:#c9d0c8;--acc:#1f7a3f;--accink:#fff;--warn:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141916;--card:#1d2420;--ink:#e8efe9;--mut:#9aa89f;--line:#33403a;--acc:#3fae68;--accink:#08130c;--warn:#ff8a80}}
:root[data-theme="dark"]{--bg:#141916;--card:#1d2420;--ink:#e8efe9;--mut:#9aa89f;--line:#33403a;--acc:#3fae68;--accink:#08130c;--warn:#ff8a80}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.msg{color:var(--mut);font-size:14px;text-align:center;margin:8px 0}
.err{color:var(--warn)}
/* urna */
.urna{background:#e3dfd1;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 -4px 0 rgba(0,0,0,.08);margin-bottom:16px}
.bezel{background:#0e0e0e;border-radius:10px;padding:12px 12px 10px}
.screen{background:#b8c1c3;color:#111;font-family:Arial,Helvetica,sans-serif;min-height:300px;padding:8px 10px;position:relative;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-size:10px;border-bottom:1px solid #8a9496;padding-bottom:3px}
.sec{margin-top:10px;padding:6px 8px;border:2px solid transparent}
.sec.on{border-color:#111}
.sec.off{opacity:.55}
.lbl{font-size:13px;font-weight:700;letter-spacing:1px}
.nrow{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px}
.box{width:26px;height:32px;border:2px solid #111;display:grid;place-items:center;font-size:22px;font-weight:700}
.nome{margin-top:6px;font-size:18px;font-weight:700;min-height:22px}
.nome small{font-size:12px;font-weight:400}
.alert{margin-top:auto;background:#111;color:#e9e9e9;text-align:center;font-size:12px;padding:5px;min-height:16px}
.hint{font-size:10px;margin-top:4px;line-height:1.3}
.fim{flex:1;display:grid;place-items:center;font-size:84px;letter-spacing:6px;font-weight:400}
.votou{position:absolute;right:12px;bottom:8px;font-size:15px;color:#4f5a5c;letter-spacing:1px}
.keys{display:flex;gap:14px;margin-top:14px;align-items:flex-start;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:9px}
.k{height:46px;border:0;border-radius:7px;background:#1d1d1d;color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #000}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.k.z{grid-column:2}
.act{display:flex;flex-direction:column;gap:9px}
.a{width:104px;border:0;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.45);letter-spacing:.5px}
.a.b{background:#f6f6f2;color:#111;height:36px}
.a.c{background:#ea5a1c;color:#111;height:36px}
.a.ok{background:#2fa646;color:#111;height:60px;font-size:15px}
.k:disabled,.a:disabled{opacity:.45;cursor:not-allowed}
/* resultados e painel */
.rt{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.row{margin:10px 0}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--acc);width:0;transition:width .4s}
h3{margin:14px 0 4px;font-size:15px}
.adm{display:flex;gap:8px;flex-wrap:wrap}
.adm input{flex:1;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;background:var(--acc);color:var(--accink);cursor:pointer}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;margin:4px 4px 0 0;font-size:14px}
.btn.sec2{background:var(--line);color:var(--ink)}.btn.dng{background:var(--warn);color:#fff}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.lock{display:block;margin:0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer}.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700;background:var(--acc);color:var(--accink)}.chip button{border:0;background:none;color:var(--warn);font-size:16px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>🗳️ Urna do Capitão</h1>
  <p class="sub">Hell’s Yes · digite o número da chapa de capitão e vice-capitão</p>
  <div id="app"><p class="msg">Carregando a urna…</p></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== CONFIGURAÇÃO (cole aqui os dados do seu projeto Firebase) =====
var FB={apiKey:"AIzaSyAJWfUi76ZvUa0M8tqT-_GqKLXoNssGwwU",authDomain:"urnaeletronica-94acf.firebaseapp.com",projectId:"urnaeletronica-94acf",appId:"1:799313372728:web:0465f3cb9323057983e8cd"};
var ADMIN_EMAIL="admin@hellsyes.com"; // o mesmo e-mail que você criar no Firebase
// =====================================================================
(function(){
var app=document.getElementById('app');
var db=null,adb=null,aauth=null,uid=null,canWrite=true,initErr='';
var chapas=[],votes=[],myVote=null,loaded={c:false,v:false,e:false};
var estado={fase:'fechada',rodando:false,base:0,desde:0};
var unlocked=false,showLogin=false,loginMsg='',fails=0,lockUntil=0,lastCount=-1;
var digits='',pend=null,alertMsg='',busy=false;

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function find(n){for(var i=0;i<chapas.length;i++)if(chapas[i].num===n)return chapas[i];return null}
function beep(){
  try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
  o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.15;o.start();
  setTimeout(function(){o.stop();a.close()},700)}catch(e){}
}
function mix(id){var h=5381;for(var i=0;i<id.length;i++)h=((h<<5)+h+id.charCodeAt(i))|0;return h}
function counted(){
  if(estado.fase!=='apuracao')return 0;
  var n=estado.rodando?estado.base+Math.floor((Date.now()-estado.desde)/1200):estado.base;
  return Math.max(0,Math.min(votes.length,n));
}

function votingOpen(){return estado.fase==='votacao'}
function canVote(){return votingOpen()&&!myVote&&chapas.length>0&&!busy}
function press(d){if(!canVote()||pend)return;if(digits.length<2){digits+=d;alertMsg='';render()}}
function branco(){if(!canVote())return;digits='';pend='blank';alertMsg='';render()}
function corrige(){if(!canVote())return;digits='';pend=null;alertMsg='';render()}
function confirma(){
  if(!canVote())return;
  if(pend==='blank'){submit('');return}
  if(digits.length<2){alertMsg='DIGITE OS DOIS NÚMEROS';render();return}
  if(!find(digits)){alertMsg='NÚMERO ERRADO — APERTE CORRIGE';render();return}
  submit(digits);
}
function submit(num){
  busy=true;render();
  var ref=db.doc('ballots/'+uid);
  db.doc('config/estado').get().then(function(es){
    if(!es.exists||es.data().fase!=='votacao'){busy=false;alertMsg='VOTAÇÃO NÃO ESTÁ ABERTA';render();return}
    return ref.get().then(function(s){
      if(s.exists){busy=false;myVote=s.data();render();return}
      var doc={chapa:num,at:Date.now()};
      return ref.set(doc).then(function(){busy=false;myVote=doc;beep();render()});
    });
  }).catch(function(){busy=false;alertMsg='ERRO AO REGISTRAR — TENTE DE NOVO';render()});
}

function line(label,value){
  var s=el('div','sec on');s.style.borderColor='transparent';
  s.appendChild(el('div','lbl',label));
  s.appendChild(el('div','nome',value||''));
  return s;
}

function buildUrna(){
  var u=el('div','urna'),bz=el('div','bezel'),sc=el('div','screen');
  var top=el('div','top');top.appendChild(el('span',null,'HELL’S YES'));top.appendChild(el('span',null,'CAPITÃO DA TRIPULAÇÃO'));
  sc.appendChild(top);
  if(myVote){
    sc.appendChild(el('div','fim','FIM'));sc.appendChild(el('div','votou','VOTOU'));
  }else if(!chapas.length||estado.fase==='fechada'){
    sc.appendChild(el('div','fim','…'));
    sc.appendChild(el('div','alert','VOTAÇÃO AINDA NÃO ABERTA'));
  }else{
    sc.appendChild(el('div','lbl','SEU VOTO PARA')).style.marginTop='8px';
    var n=el('div','nrow');n.style.margin='8px 8px 0';n.appendChild(el('span',null,'Número:'));
    for(var i=0;i<2;i++)n.appendChild(el('span','box',pend?'':(digits[i]||'')));
    sc.appendChild(n);
    var c=digits.length===2?find(digits):null,cap='',vice='';
    if(pend==='blank'){cap='VOTO EM BRANCO';vice='VOTO EM BRANCO'}
    else if(c){cap=c.captain;vice=c.vice}
    else if(digits.length===2){cap='NÚMERO ERRADO';vice='NÚMERO ERRADO'}
    sc.appendChild(line('CAPITÃO',cap));
    sc.appendChild(line('VICE-CAPITÃO',vice));
    var h=el('div','hint','Aperte a tecla:\nVERDE para CONFIRMAR · LARANJA para CORRIGIR');h.style.whiteSpace='pre-line';
    sc.appendChild(h);
    sc.appendChild(el('div','alert',busy?'REGISTRANDO…':alertMsg));
  }
  bz.appendChild(sc);u.appendChild(bz);
  var keys=el('div','keys'),pd=el('div','pad'),off=!canVote();
  [1,2,3,4,5,6,7,8,9,0].forEach(function(d){
    var b=el('button','k'+(d===0?' z':''),String(d));b.disabled=off;
    b.onclick=function(){press(String(d))};pd.appendChild(b);
  });
  var act=el('div','act');
  var bb=el('button','a b','BRANCO'),bc=el('button','a c','CORRIGE'),bo=el('button','a ok','CONFIRMA');
  [bb,bc,bo].forEach(function(b){b.disabled=off});
  bb.onclick=branco;bc.onclick=corrige;bo.onclick=confirma;
  act.appendChild(bb);act.appendChild(bc);act.appendChild(bo);
  keys.appendChild(pd);keys.appendChild(act);u.appendChild(keys);
  return u;
}

function renderList(){
  var c=el('div','card');c.appendChild(el('strong',null,'Chapas'));
  chapas.forEach(function(p){
    var r=el('p',null,p.num+' · '+p.captain+' (capitão) e '+p.vice+' (vice)');r.style.margin='8px 0 0';c.appendChild(r);
  });
  app.appendChild(c);
}

function renderWait(){
  var c=el('div','card');
  c.appendChild(el('strong',null,'Voto registrado ✓'));
  c.appendChild(el('p','sub','Aguarde: o resultado aparece quando o organizador encerrar a votação e fizer a apuração.'));
  app.appendChild(c);
}

function renderApuracao(){
  var c=el('div','card'),total=votes.length,n=counted(),done=n>=total;
  var ord=votes.slice().sort(function(a,b){return mix(a.id)-mix(b.id)}).slice(0,n);
  var blank=0,tally={};
  chapas.forEach(function(p){tally[p.num]=0});
  ord.forEach(function(v){if(!v.chapa)blank++;else if(v.chapa in tally)tally[v.chapa]++});
  var st=el('div','rt'),t=el('strong',null,'🗳️ Apuração');
  var tag=done?'Concluída':(estado.rodando?'Apurando…':'Pausada');
  st.appendChild(t);st.appendChild(el('span','pill',tag));c.appendChild(st);
  c.appendChild(el('p','sub','Votos apurados: '+n+' de '+total));
  var tr0=el('div','track'),f0=el('div','fill');f0.style.width=(total?n/total*100:0)+'%';tr0.appendChild(f0);c.appendChild(tr0);
  var list=chapas.slice().sort(function(a,b){return tally[b.num]-tally[a.num]});
  list.forEach(function(p){
    var r=el('div','row'),tt=el('div','rt'),mine=myVote&&myVote.chapa===p.num;
    tt.appendChild(el('span',null,p.num+' · '+p.captain+' e '+p.vice+(mine?' ✓':'')));
    tt.appendChild(el('span',null,String(tally[p.num])));
    var tr=el('div','track'),fl=el('div','fill');fl.style.width=(n?tally[p.num]/n*100:0)+'%';
    tr.appendChild(fl);r.appendChild(tt);r.appendChild(tr);c.appendChild(r);
  });
  c.appendChild(el('div','msg','Em branco: '+blank+(myVote&&!myVote.chapa?' ✓':'')));
  if(done&&total&&list.length){
    var top=tally[list[0].num],emp=list.filter(function(p){return tally[p.num]===top}).length>1;
    var w=el('p',null,emp?'Empate no topo — sem vencedor definido.':'🏆 Vencedor: '+list[0].captain+' e '+list[0].vice);
    w.style.cssText='text-align:center;font-weight:700;font-size:17px;margin:12px 0 0';c.appendChild(w);
  }
  if(!total)c.appendChild(el('p','msg','Nenhum voto registrado.'));
  app.appendChild(c);
}

function saveChapas(list){
  adb.doc('config/chapas').set({chapas:list}).catch(function(){alert('Não foi possível salvar.')});
}
function saveEstado(o){
  adb.doc('config/estado').set(o).catch(function(){alert('Não foi possível salvar.')});
}
function abrir(){saveEstado({fase:'votacao',rodando:false,base:0,desde:0})}
function fechar(){
  if(!confirm('Fechar a votação? Ninguém poderá votar até você abrir de novo.'))return;
  saveEstado({fase:'fechada',rodando:false,base:0,desde:0});
}
function encerrar(){
  if(!confirm('Encerrar a votação? Ninguém mais poderá votar e a apuração começará.'))return;
  saveEstado({fase:'apuracao',rodando:true,base:0,desde:Date.now()});
}
function togglePausa(){
  if(estado.rodando)saveEstado({fase:'apuracao',rodando:false,base:counted(),desde:0});
  else saveEstado({fase:'apuracao',rodando:true,base:estado.base,desde:Date.now()});
}
function reiniciar(){saveEstado({fase:'apuracao',rodando:true,base:0,desde:Date.now()})}
function reabrir(){
  if(!confirm('Reabrir a votação? A apuração será zerada.'))return;
  saveEstado({fase:'fechada',rodando:false,base:0,desde:0});
}

function renderLogin(){
  var c=el('div','card');c.appendChild(el('strong',null,'🔒 Painel do administrador'));
  var w=el('div','adm');w.style.marginTop='10px';
  var i=document.createElement('input');i.type='password';i.placeholder='Senha';i.autocomplete='off';
  i.onkeydown=function(e){e.stopPropagation();if(e.key==='Enter')go.click()};
  w.appendChild(i);
  var go=el('button','btn','Entrar');
  go.onclick=async function(){
    if(Date.now()<lockUntil){loginMsg='Muitas tentativas. Aguarde alguns segundos.';render();return}
    try{
      await aauth.signInWithEmailAndPassword(ADMIN_EMAIL,i.value);
      i.value='';fails=0;unlocked=true;showLogin=false;loginMsg='';render();
    }catch(e){
      fails++;if(fails>=5){fails=0;lockUntil=Date.now()+30000}loginMsg='Senha incorreta.';render();
    }
  };
  w.appendChild(go);c.appendChild(w);
  if(loginMsg)c.appendChild(el('p','msg err',loginMsg));
  var cx=el('button','btn sec2','Cancelar');cx.style.marginTop='10px';cx.onclick=function(){showLogin=false;loginMsg='';render()};
  c.appendChild(cx);
  app.appendChild(c);
}

function renderAdmin(){
  var c=el('div','card');c.appendChild(el('strong',null,'Painel do administrador'));
  var fs=estado.fase;
  var s=el('p','sub','Situação: ');s.appendChild(el('span','pill',fs==='fechada'?'Votação fechada':fs==='votacao'?'Votação aberta':(estado.rodando?'Apurando':'Apuração pausada')));
  s.appendChild(document.createTextNode(' · '+votes.length+(votes.length===1?' voto':' votos')));
  c.appendChild(s);
  var bt=el('div','btns');
  if(fs==='fechada'){
    var ao=el('button','btn','▶ Abrir votação');ao.onclick=abrir;bt.appendChild(ao);
  }else if(fs==='votacao'){
    var e=el('button','btn dng','Encerrar votação e apurar');e.onclick=encerrar;bt.appendChild(e);
    var fc=el('button','btn sec2','Fechar votação (sem apurar)');fc.onclick=fechar;bt.appendChild(fc);
  }else{
    var p=el('button','btn',estado.rodando?'⏸ Pausar apuração':'▶ Retomar apuração');p.onclick=togglePausa;bt.appendChild(p);
    var r=el('button','btn sec2','↺ Reiniciar apuração');r.onclick=reiniciar;bt.appendChild(r);
    var o=el('button','btn dng','Reabrir votação');o.onclick=reabrir;bt.appendChild(o);
  }
  c.appendChild(bt);
  c.appendChild(el('h3',null,'Chapas'));
  c.appendChild(el('p','sub','Cadastre cada chapa: número de dois dígitos, capitão e vice.'));
  var w=el('div','adm'),ins=[];
  [['Nº','2'],['Capitão','20'],['Vice','20']].forEach(function(f,k){
    var i=document.createElement('input');i.placeholder=f[0];i.maxLength=+f[1];
    if(k===0){i.inputMode='numeric';i.style.flex='0 0 56px'}
    i.onkeydown=function(e){e.stopPropagation();if(e.key==='Enter')b.click()};
    ins.push(i);w.appendChild(i);
  });
  var b=el('button','btn','Adicionar');
  b.onclick=function(){
    var n=ins[0].value.trim(),cp=ins[1].value.trim(),vc=ins[2].value.trim();
    if(!/^[0-9]{2}$/.test(n)||!cp||!vc||find(n))return;
    saveChapas(chapas.concat([{num:n,captain:cp,vice:vc}]));
    ins.forEach(function(i){i.value=''});
  };
  w.appendChild(b);c.appendChild(w);
  chapas.forEach(function(p){
    var ch=el('span','chip',p.num+' · '+p.captain+' / '+p.vice),x=el('button',null,'×');x.title='Remover';
    x.onclick=function(){saveChapas(chapas.filter(function(q){return q.num!==p.num}))};
    ch.appendChild(x);c.appendChild(ch);
  });
  var sair=el('button','btn sec2','Sair do painel');sair.style.marginTop='14px';
  sair.onclick=function(){unlocked=false;aauth.signOut();render()};c.appendChild(sair);
  app.appendChild(c);
}

function render(){
  var vals=[],fi=-1;
  app.querySelectorAll('input').forEach(function(i,k){vals.push(i.value);if(i===document.activeElement)fi=k});
  app.textContent='';
  if(!db){app.appendChild(el('p','msg err',initErr||'Não consegui abrir a urna. Tente recarregar a página.'));return}
  if(!loaded.c||!loaded.v||!loaded.e){app.appendChild(el('p','msg','Carregando a urna…'));return}
  lastCount=counted();
  if(estado.fase!=='apuracao'){
    app.appendChild(buildUrna());
    if(chapas.length&&!myVote)renderList();
    if(myVote)renderWait();
  }else renderApuracao();
  if(unlocked)renderAdmin();
  else if(showLogin)renderLogin();
  else{var l=el('button','lock','🔒 Administrador');l.onclick=function(){showLogin=true;render()};app.appendChild(l)}
  var ni=app.querySelectorAll('input');
  vals.forEach(function(v,k){if(ni[k])ni[k].value=v});
  if(fi>=0&&ni[fi])ni[fi].focus();
}

document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Enter')confirma();
  else if(e.key==='Backspace')corrige();
});

setInterval(function(){
  if(estado.fase==='apuracao'&&estado.rodando&&counted()!==lastCount)render();
},400);

(async function init(){
  try{
    if(!window.firebase||String(FB.apiKey).indexOf('COLE')===0){initErr='Falta colar a configuração do Firebase no código.';db=null;render();return}
    firebase.initializeApp(FB);
    var ap2=firebase.initializeApp(FB,'admin');
    adb=ap2.firestore();aauth=ap2.auth();
    try{await aauth.signOut()}catch(e){}
    db=firebase.firestore();
    var cred=await firebase.auth().signInAnonymously();
    uid=cred.user.uid;
    db.doc('config/chapas').onSnapshot(function(s){
      chapas=(s.exists&&s.data().chapas)||[];loaded.c=true;render();
    },function(){loaded.c=true;render()});
    db.doc('config/estado').onSnapshot(function(s){
      estado=(s.exists&&s.data())||{fase:'fechada',rodando:false,base:0,desde:0};loaded.e=true;render();
    },function(){loaded.e=true;render()});
    db.collection('ballots').onSnapshot(function(s){
      votes=[];myVote=null;
      s.docs.forEach(function(d){var v=d.data();v.id=d.id;votes.push(v);if(d.id===uid)myVote=v});
      loaded.v=true;render();
    },function(){loaded.v=true;render()});
  }catch(e){db=null;render()}
})();
})();
</script>
</body>
</html>
